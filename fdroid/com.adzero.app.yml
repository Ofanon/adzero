# Recette de compilation pour F-Droid.
#
# A copier dans un fork de gitlab.com/fdroid/fdroiddata sous
# metadata/com.adzero.app.yml, puis proposer en merge request avec le label
# "New App". Ce fichier vit ici pour qu'il reste versionne avec l'app : c'est
# lui qu'il faudra mettre a jour a chaque version.
#
# Rien a signaler dans AntiFeatures : pas de pub, pas de pistage, pas de
# dependance non libre, pas de service reseau proprietaire.

Categories:
  - Internet
  - Security
License: GPL-3.0-or-later
AuthorName: GameSkar
AuthorEmail: contact.gameskar@gmail.com
WebSite: https://github.com/Ofanon/adzero
SourceCode: https://github.com/Ofanon/adzero
IssueTracker: https://github.com/Ofanon/adzero/issues

RepoType: git
Repo: https://github.com/Ofanon/adzero.git

Builds:
  - versionName: '1.0'
    versionCode: 2
    commit: v1.0
    subdir: app
    gradle:
      - yes

# Les tags de version sont la source de verite : poser un tag vX.Y suffit a
# declencher la prise en compte de la version suivante.
AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 2
